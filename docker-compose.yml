# Flora Alchemy — Docker Compose (production-like local environment)
# Usage: docker-compose up --build

version: '3.8'

services:
  # ── MongoDB ──────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: flora-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: flora_alchemy

  # ── Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flora-backend
    restart: unless-stopped
    ports:
      - '4000:4000'
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://mongodb:27017/flora_alchemy
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      SEED_ON_START: 'false'
      TRUST_PROXY: 'false'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Frontend (nginx for SPA) ────────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: flora-frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  mongodb_data:
